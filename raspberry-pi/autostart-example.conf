# ==============================================================================
# NBKRIST Smart Digital Notice Board - Raspberry Pi Autostart Configuration
# ==============================================================================
# File: autostart-example.conf
#
# USAGE INSTRUCTIONS:
#
# 1. For Raspberry Pi OS (Bullseye / Buster / LXDE Desktop):
#    Copy or append this file to:
#      ~/.config/lxsession/LXDE-pi/autostart
#    Or system-wide:
#      /etc/xdg/lxsession/LXDE-pi/autostart
#
# 2. For Raspberry Pi OS (Bookworm / Wayland / Wayfire):
#    Add to ~/.config/wayfire.ini under the [autostart] section:
#      [autostart]
#      kiosk = /home/pi/nbkrist-signage/raspberry-pi/kiosk-start.sh
#      screensaver = false
#      dpms = false
# ==============================================================================

# Disable screensaver and display blanking (prevent TV sleep)
@xset s off
@xset -dpms
@xset s noblank

# Hide mouse cursor when inactive (requires: sudo apt-get install unclutter)
@unclutter -idle 0.5 -root

# Launch NBKRIST Smart Digital Signage Kiosk Script
@/bin/bash /home/pi/nbkrist-signage/raspberry-pi/kiosk-start.sh
